# ─────────────────────────────────────────────────────────────────────────────
# build_fork_apk.yml
#
# Builds the Kiwi Browser fork APK for arm64 on a GitHub-hosted runner.
#
# Architecture
# ────────────
# This fork is a PATCH SET on top of Chromium — it only contains modified
# files, not the full Chromium source tree. The build therefore has two phases:
#
#   Phase A — Prepare source tree:
#     1. Check out the fork (modified files only) → fork/
#     2. Fetch full Chromium at the pinned version (CHROMIUM_VERSION) → src/
#     3. Overlay the fork's files on top of src/
#
#   Phase B — Build:
#     4. Run build dependency scripts (now that src/build/ exists)
#     5. gclient runhooks (downloads NDK, SDK, Clang)
#     6. gn gen + ninja → src/out/android_arm64/apks/ChromePublic.apk
#
# No external build servers, SSH keys, rclone, or Kiwi secrets required.
# APK is uploaded as a GitHub Actions artifact (not a Release).
# ─────────────────────────────────────────────────────────────────────────────

name: 'Fork: Build APK (arm64, self-contained)'

on:
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Optional version name suffix (e.g. kiwi-monochrome)'
        required: false
        default: 'fork'

jobs:
  build_arm64:
    name: Build arm64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # ── 0. Print context ────────────────────────────────────────────────────
      - name: Print workflow context
        run: |
          echo "Run ID  : ${{ github.run_id }}"
          echo "Actor   : ${{ github.actor }}"
          echo "Ref     : ${{ github.ref }}"
          echo "Suffix  : ${{ github.event.inputs.version_suffix || 'fork' }}"

      # ── 1. Free up disk space ────────────────────────────────────────────────
      # Chromium source + build output needs ~80 GB.
      # GitHub-hosted ubuntu-latest starts with ~25 GB free, so we reclaim
      # everything non-essential before doing anything else.
      - name: Reclaim disk — disable swap
        run: |
          sudo swapoff -av
          sudo rm -f /swapfile

      - name: Reclaim disk — remove large pre-installed packages
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" \
            /usr/share/swift \
            /opt/hostedtoolcache/CodeQL
          sudo apt-get remove -y \
            azure-cli google-cloud-sdk hhvm google-chrome-stable \
            firefox powershell mono-devel || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          echo "=== Disk after cleanup ==="
          df -h

      # ── 2. Install system build dependencies ─────────────────────────────────
      - name: Install system build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pip python-is-python3 \
            git curl wget ca-certificates \
            openjdk-11-jdk-headless \
            ccache lsb-release \
            pkg-config zip unzip \
            xz-utils bzip2 \
            libc6-dev libffi-dev libssl-dev \
            binutils

      # ── 3. Check out the fork ────────────────────────────────────────────────
      # The fork contains only modified files (chrome/, base/, components/, etc.)
      # We check it out into fork/ so we can overlay it on top of Chromium later.
      - name: Checkout fork (modified files)
        uses: actions/checkout@v4
        with:
          path: fork
          fetch-depth: 1

      # ── 4. Read the pinned Chromium version ──────────────────────────────────
      - name: Read pinned Chromium version
        id: chromium_ver
        run: |
          source fork/CHROMIUM_VERSION
          TAG="${CHROMIUM_MAJOR}.${CHROMIUM_MINOR}.${CHROMIUM_BUILD}.${CHROMIUM_PATCH}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Pinned Chromium version: $TAG"

      # ── 5. Install depot_tools ───────────────────────────────────────────────
      - name: Install depot_tools
        run: |
          git clone --depth=1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            depot_tools
          echo "$GITHUB_WORKSPACE/depot_tools" >> $GITHUB_PATH

      # ── 6. Write .gclient pointing at the pinned Chromium tag ────────────────
      # This tells gclient to fetch the FULL Chromium source at exactly the
      # version this fork was built against. The fork's DEPS are irrelevant here;
      # we want the upstream Chromium DEPS at that tag.
      - name: Write .gclient configuration
        run: |
          TAG="${{ steps.chromium_ver.outputs.tag }}"
          cat > .gclient <<EOF
          solutions = [
            {
              "name": "src",
              "url": "https://chromium.googlesource.com/chromium/src.git@refs/tags/${TAG}",
              "managed": False,
              "custom_deps": {},
              "custom_vars": {},
            },
          ]
          target_os = ["android"]
          EOF
          echo "=== .gclient ==="
          cat .gclient

      # ── 7. Restore ccache ────────────────────────────────────────────────────
      - name: Restore ccache cache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-arm64-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-arm64-${{ runner.os }}-

      - name: Configure ccache
        run: |
          ccache --set-config=max_size=8G
          ccache --set-config=cache_dir=$HOME/.ccache
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache -z

      # ── 8. gclient sync — fetch full Chromium source ─────────────────────────
      # This downloads ~20–30 GB of source code.
      # --no-history : shallow clones for all deps (saves ~20 GB bandwidth)
      # --nohooks    : skip hooks; we run install-build-deps-android.sh manually
      # --force/--reset : overwrite any local state
      # -D           : delete deps that are no longer needed
      - name: Sync full Chromium source (gclient sync)
        run: |
          gclient sync \
            --no-history \
            --nohooks \
            --force \
            --reset \
            -D
        env:
          DEPOT_TOOLS_UPDATE: "0"

      # ── 9. Overlay fork modifications ────────────────────────────────────────
      # Copy the fork's modified files on top of the freshly synced Chromium src.
      # This is the equivalent of what Kiwi's build server does: it rebases the
      # fork's commits onto the Chromium base and builds the merged tree.
      - name: Overlay fork files onto Chromium source
        run: |
          echo "=== Overlaying fork modifications ==="
          for dir in chrome base components content extensions net remoting services third_party ui; do
            if [ -d "fork/$dir" ]; then
              echo "  Overlaying fork/$dir → src/$dir"
              cp -r "fork/$dir/." "src/$dir/"
            fi
          done
          echo "=== Overlay complete ==="
          df -h

      # ── 10. Install Android build dependencies ───────────────────────────────
      # Now that src/build/ exists (from the Chromium sync), this script works.
      - name: Install Android build dependencies
        run: |
          sudo src/build/install-build-deps-android.sh

      # ── 11. gclient runhooks ─────────────────────────────────────────────────
      # Downloads the Android NDK, SDK, and Clang toolchain.
      - name: Run gclient runhooks
        run: gclient runhooks
        env:
          DEPOT_TOOLS_UPDATE: "0"

      # ── 12. Create output directory and write args.gn ────────────────────────
      - name: Create output directory and write args.gn
        run: |
          mkdir -p src/out/android_arm64

          VERSION_NAME="Git$(date '+%y%m%d')${{ github.event.inputs.version_suffix || 'fork' }}"
          VERSION_CODE="$(date '+%y%m%d')2"

          # Derive from the production args.gn in the fork
          sed \
            -e "s|target_cpu = \"arm\"|target_cpu = \"arm64\"|g" \
            -e "s|android_default_version_name = \"Git\"|android_default_version_name = \"${VERSION_NAME}\"|" \
            -e "s|android_default_version_code = \"1\"|android_default_version_code = \"${VERSION_CODE}\"|" \
            fork/.build/production_build_reference/args.gn \
            > src/out/android_arm64/args.gn

          # symbol_level=0 saves ~4 GB of debug symbol files
          echo "symbol_level = 0" >> src/out/android_arm64/args.gn

          echo "=== args.gn ==="
          cat src/out/android_arm64/args.gn

      # ── 13. Generate throw-away signing keystore ─────────────────────────────
      # args.gn references ../../keystore.jks relative to out/android_arm64,
      # which resolves to src/keystore.jks.
      - name: Generate throw-away signing keystore
        run: |
          keytool \
            -genkey -v \
            -keystore src/keystore.jks \
            -alias dev \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass public_password \
            -keypass  public_password \
            -dname "CN=Kiwi Fork (unverified), OU=GHA, O=Fork, C=GH"

      # ── 14. gn gen ───────────────────────────────────────────────────────────
      - name: Generate build files (gn gen)
        run: |
          cd src
          gn gen out/android_arm64

      # ── 15. ninja — build chrome_public_apk ─────────────────────────────────
      # -j2 matches the 2 vCPUs available on ubuntu-latest.
      - name: Build chrome_public_apk (arm64)
        run: |
          cd src
          ninja -C out/android_arm64 -j2 chrome_public_apk
        env:
          CCACHE_DIR: ${{ env.HOME }}/.ccache

      # ── 16. Print ccache stats ───────────────────────────────────────────────
      - name: Print ccache statistics
        if: always()
        run: ccache -s

      # ── 17. Save ccache ──────────────────────────────────────────────────────
      - name: Save ccache cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-arm64-${{ runner.os }}-${{ github.run_id }}

      # ── 18. Verify APK ───────────────────────────────────────────────────────
      - name: Verify APK output
        run: |
          APK="src/out/android_arm64/apks/ChromePublic.apk"
          if [ ! -f "$APK" ]; then
            echo "❌ ChromePublic.apk not found at: $APK"
            find src/out/android_arm64/ -name "*.apk" 2>/dev/null | head -10
            exit 1
          fi
          echo "✅ APK found: $APK"
          ls -lh "$APK"

      # ── 19. Upload APK artifact ──────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-fork-arm64-${{ github.run_id }}
          path: src/out/android_arm64/apks/ChromePublic.apk
          retention-days: 30
          if-no-files-found: error

      # ── 20. Job summary ──────────────────────────────────────────────────────
      - name: Write success summary
        if: success()
        run: |
          echo "## ✅ Build succeeded" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| APK | \`ChromePublic.apk\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | \`kiwi-fork-arm64-${{ github.run_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Architecture | arm64 |" >> $GITHUB_STEP_SUMMARY
          echo "| Chromium base | ${{ steps.chromium_ver.outputs.tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Run ID | ${{ github.run_id }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download from the **Artifacts** section of this run." >> $GITHUB_STEP_SUMMARY

      - name: Write failure summary
        if: failure()
        run: |
          echo "## ❌ Build failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the step logs above for the error." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Disk at failure" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          df -h >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
